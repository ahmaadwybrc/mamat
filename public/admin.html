<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKJ Hotspot Gateway - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #07090e;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .card-bg { background: #0d1322; border: 1px solid #1e293b; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
                    TKJ HOTSPOT GATEWAY ADMIN
                </h1>
                <p class="text-xs text-slate-400 mono mt-1">RouterOS Interface: wlan1-hotspot</p>
            </div>
            <button onclick="loadUsers()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs mono font-bold rounded border border-slate-700 flex items-center gap-2">
                🔄 REFRESH DATA
            </button>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="card-bg p-4 rounded-xl">
                <div class="text-xs text-slate-400 mono">TOTAL REGISTRATIONS</div>
                <div class="text-3xl font-bold mt-2 text-slate-100" id="totalCount">0</div>
            </div>
            <div class="card-bg p-4 rounded-xl border-t-2 border-amber-500">
                <div class="text-xs text-amber-400 mono">PENDING APPROVAL</div>
                <div class="text-3xl font-bold mt-2 text-amber-400" id="pendingCount">0</div>
            </div>
            <div class="card-bg p-4 rounded-xl border-t-2 border-emerald-500">
                <div class="text-xs text-emerald-400 mono">APPROVED / ACTIVE</div>
                <div class="text-3xl font-bold mt-2 text-emerald-400" id="approvedCount">0</div>
            </div>
            <div class="card-bg p-4 rounded-xl border-t-2 border-rose-500">
                <div class="text-xs text-rose-400 mono">BLOCKED / REJECTED</div>
                <div class="text-3xl font-bold mt-2 text-rose-400" id="rejectedCount">0</div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="card-bg rounded-xl p-6">
            <h2 class="text-sm font-bold text-slate-200 mono mb-4">SUBSCRIBER ACTIVE SESSION TABLE</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400 mono">
                            <th class="p-3">USER & CREDENTIALS</th>
                            <th class="p-3">CONTACT</th>
                            <th class="p-3">STATUS</th>
                            <th class="p-3">DATE REGISTERED</th>
                            <th class="p-3 text-right">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="text-xs mono divide-y divide-slate-800/50">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-500">Memuat data dari Upstash Redis...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            const tableBody = document.getElementById('userTableBody');
            try {
                const response = await fetch('/api/users');
                const data = await response.json();

                if (!data.success || !data.users) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-400">Gagal mengambil data pengguna.</td></tr>`;
                    return;
                }

                const users = data.users;

                // Update Counter
                document.getElementById('totalCount').textContent = users.length;
                document.getElementById('pendingCount').textContent = users.filter(u => u.status === 'pending').length;
                document.getElementById('approvedCount').textContent = users.filter(u => u.status === 'approved').length;
                document.getElementById('rejectedCount').textContent = users.filter(u => u.status === 'rejected').length;

                if (users.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Belum ada user mendaftar.</td></tr>`;
                    return;
                }

                // Render Data Table
                tableBody.innerHTML = users.map(user => {
                    let statusBadge = '';
                    if (user.status === 'approved') {
                        statusBadge = `<span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded">ACCEPTED</span>`;
                    } else if (user.status === 'rejected') {
                        statusBadge = `<span class="px-2 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded">REJECTED</span>`;
                    } else {
                        statusBadge = `<span class="px-2 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded">PENDING</span>`;
                    }

                    const dateStr = user.createdAt ? new Date(user.createdAt).toLocaleString('id-ID') : '-';

                    return `
                        <tr class="hover:bg-slate-800/30">
                            <td class="p-3">
                                <div class="font-bold text-slate-200">${user.name || '-'}</div>
                                <div class="text-cyan-400">user: ${user.username}</div>
                            </td>
                            <td class="p-3 text-slate-400">
                                <div>${user.email || '-'}</div>
                                <div>${user.phone || '-'}</div>
                            </td>
                            <td class="p-3">${statusBadge}</td>
                            <td class="p-3 text-slate-500">${dateStr}</td>
                            <td class="p-3 text-right space-x-2">
                                ${user.status === 'pending' ? `
                                    <button onclick="approveUser('${user.username}')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded">APPROVE</button>
                                    <button onclick="rejectUser('${user.username}')" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded">REJECT</button>
                                ` : ''}
                                <button onclick="deleteUser('${user.username}')" class="px-2 py-1 bg-slate-800 hover:bg-rose-900 text-slate-400 hover:text-rose-200 rounded">DROP</button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-400">Terjadi kesalahan koneksi ke API.</td></tr>`;
            }
        }

        async function approveUser(username) {
            if (!confirm(`Setujui pendaftaran ${username}?`)) return;
            try {
                const res = await fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, adminName: 'Admin' })
                });
                const result = await res.json();
                alert(result.message);
                loadUsers();
            } catch (e) {
                alert('Gagal menyetujui user');
            }
        }

        async function rejectUser(username) {
            if (!confirm(`Tolak pendaftaran ${username}?`)) return;
            try {
                const res = await fetch('/api/reject', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, adminName: 'Admin' })
                });
                const result = await res.json();
                alert(result.message);
                loadUsers();
            } catch (e) {
                alert('Gagal menolak user');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Hapus permanen user ${username}?`)) return;
            try {
                const res = await fetch(`/api/users/${username}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                loadUsers();
            } catch (e) {
                alert('Gagal menghapus user');
            }
        }

        // Jalankan saat halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
