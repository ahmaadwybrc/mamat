<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Pack Registration - TKJ Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050811;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(239, 68, 68, 0.05) 0%, transparent 40%),
                linear-gradient(to right, rgba(15, 23, 42, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .container {
            background: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-top: 3px solid #00f2fe;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 242, 254, 0.15);
            padding: 36px;
            max-width: 440px;
            width: 100%;
        }
        .terminal-bar {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 24px; padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.6); }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }
        .terminal-title {
            margin-left: auto; font-family: 'JetBrains Mono', monospace;
            font-size: 10px; color: #38bdf8; text-transform: uppercase; font-weight: 700; letter-spacing: 0.15em;
        }
        .header { text-align: center; margin-bottom: 24px; }
        
        .wolf-avatar {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wolf-avatar svg {
            width: 30px;
            height: 30px;
            fill: #00f2fe;
        }

        .header h1 { 
            font-size: 20px; font-weight: 800; margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #00f2fe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .header p { color: #94a3b8; font-size: 11px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; margin-bottom: 6px; color: #94a3b8;
            font-weight: 600; font-size: 11px; font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .form-group input {
            width: 100%; padding: 11px 14px; background: rgba(5, 8, 17, 0.8);
            border: 1px solid #1e293b; border-radius: 8px; font-size: 13px;
            font-family: 'JetBrains Mono', monospace; color: #f8fafc; outline: none;
            transition: all 0.2s ease;
        }
        .form-group input:focus { border-color: #00f2fe; box-shadow: 0 0 12px rgba(0, 242, 254, 0.25); background: #070c18; }
        .btn {
            width: 100%; padding: 13px; background: linear-gradient(135deg, #00f2fe 0%, #0284c7 100%);
            color: #050811; border: none; border-radius: 8px; font-size: 12px;
            font-weight: 800; font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
            cursor: pointer; margin-top: 8px; letter-spacing: 0.15em;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); transition: all 0.2s ease;
        }
        .btn:hover { opacity: 0.95; box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5); transform: translateY(-1px); }
        .btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; box-shadow: none; }
        .message {
            padding: 12px 16px; border-radius: 8px; margin-top: 14px;
            display: none; font-size: 11px; text-align: center;
            font-family: 'JetBrains Mono', monospace;
        }
        .message.error { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .login-link { text-align: center; margin-top: 20px; color: #64748b; font-size: 12px; }
        .login-link a { color: #00f2fe; text-decoration: none; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .loading {
            display: inline-block; width: 10px; height: 10px;
            border: 2px solid rgba(5, 8, 17, 0.4); border-radius: 50%;
            border-top-color: #050811; animation: spin 0.8s linear infinite; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">🐺 PACK REGISTRATION</div>
        </div>

        <div class="header">
            <div class="wolf-avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12,2L9,7L3,9L6,14L4,22L12,18L20,22L18,14L21,9L15,7L12,2M12,6.5L13.8,9.5L17.5,10.7L15.6,13.8L16.8,18.8L12,16.2L7.2,18.8L8.4,13.8L6.5,10.7L10.2,9.5L12,6.5Z"/>
                </svg>
            </div>
            <h1>Gabung Ke Wolf Pack</h1>
            <p>TKJ Telemetry Network Interface</p>
        </div>

        <!-- Form Submit Native Langsung ke URL Absolut Vercel -->
        <form id="registerForm" action="https://mamat-git-main-ahmad5-388c.vercel.app/api/register" method="POST">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Masukkan email">
            </div>
            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone" required placeholder="Masukkan nomor telepon">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Konfirmasi password">
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar Anggota Pack</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', (e) => {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                e.preventDefault(); // Hentikan kirim jika password beda
                showMessage('Password tidak cocok!', 'error');
                return;
            }

            // Izinkan form terkirim secara native
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Memproses...';
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
